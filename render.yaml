services:
  - type: web
    name: solace-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false        # paste your Atlas URI in the Render dashboard
      - key: DB_NAME
        value: solace
      - key: ALLOWED_ORIGIN
        sync: false        # paste your Netlify URL after deploy
