<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>KINGZEVI — Music</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="CSS/style.css"/>
</head>
<body>
    <!-- ── HEADER ── -->
<header>
  <div class="logo"><a class="keep" href="/">KING<span>Z</span>EVI</a></div>
  <nav class="nav-links">
    <a onclick="goto('music')" class="keep">Music</a>
    <a onclick="goto('community')" class="keep">Community</a>
  </nav>
  <div class="header-auth" id="header-guest">
    <button class="btn-sm btn-outline" onclick="openAuth('login')">Sign In</button>
    <button class="btn-sm btn-gold" onclick="openAuth('register')">Join</button>
  </div>
  <div style="display:none" id="header-user">
    <div class="user-pill">
      <span class="u-avatar" id="h-avatar">🎧</span>
      <span class="u-name" id="h-name"></span>
      <span class="u-role fan" id="h-role"></span>
      <button class="btn-ghost-sm" onclick="logout()">Sign out</button>
    </div>
  </div>
</header>
<!-- ── SINGLES ── -->
<section id="music">
  <p class="section-label">Singles</p>
  <h2 class="section-title">Latest Drops</h2>
  <div id="singles-grid" class="music-grid"><div class="loading-state"><div class="spinner"></div>Loading…</div></div>
</section>

<!-- ── ALBUMS ──  -->
<section id="albums" style="padding-top:0">
  <p class="section-label">Albums</p>
  <h2 class="section-title">Full Projects</h2>
  <div id="albums-grid" class="music-grid"><div class="loading-state"><div class="spinner"></div>Loading…</div></div>
</section>
<script src="js/helper.js"></script>
</body>
</html>
