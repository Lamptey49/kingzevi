[build]
  publish = "public"
  command = ""

[[redirects]]
  from   = "/api/*"
  to     = "https://YOUR-APP-NAME.onrender.com/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/uploads/*"
  to     = "https://YOUR-APP-NAME.onrender.com/uploads/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
